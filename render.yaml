services:
  - type: web
    name: agms-api
    runtime: docker
    repo: https://github.com/Muhammadasif1986/meat_shop_online_app.git
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["https://agms-admin.vercel.app"]'