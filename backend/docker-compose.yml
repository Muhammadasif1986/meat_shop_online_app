version: "3.8"

services:
  flutter:
    image: cirrusci/flutter:3.22.2
    ports:
      - "8080:8080"
    volumes:
      - ../mobile:/app
    working_dir: /app
    command: >
      sh -c "flutter pub get && flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0"
    profiles:
      - mobile

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agms-network

  celery_worker:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - agms-network

  celery_beat:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - agms-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agms-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - agms-network

volumes:
  pgdata:
  redisdata:

networks:
  agms-network:
    driver: bridge
